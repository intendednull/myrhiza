[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/manifest",
    "crates/backend",
    "crates/wasmtime-backend",
    "crates/kernel",
    "crates/test-utils",
]
exclude = [
    # Wasm-only fixtures — built for wasm32-unknown-unknown by
    # `just build-fixtures` and wrapped into components via wasm-tools.
    # Workspace inclusion would force `cargo check --workspace` to
    # attempt cross-compiling on every gate run.
    "tests/fixtures/counter-state-apply",
    "tests/fixtures/over-importer",
    "tests/fixtures/pre-check-rejector",
    "tests/fixtures/infinite-loop",
    "tests/fixtures/float-banned",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/intendednull/myrhiza"
rust-version = "1.95"

[workspace.dependencies]
# Pins required by determinism.md §5.4 and distribution.md §10.2.
bincode = "=1.3.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
blake3 = { version = "1.5", features = ["traits-preview"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast"] }
toml_edit = { version = "0.22", default-features = false, features = ["parse", "serde"] }
unicode-normalization = "0.1"
thiserror = "1"
hex = "0.4"
# Wasmtime LTS — kernel-major bump per browser-native.md §14.2.
wasmtime = { version = "=36.0.9", default-features = false, features = ["component-model", "cranelift", "runtime"] }
wasmtime-wasi = { version = "=36.0.9", default-features = false }
# Test/dev only.
anyhow = "1"
hex-literal = "0.4"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# panic!() / unwrap()/expect() are warns workspace-wide so the
# state-apply runtime path stays panic-free. Test-only crates and
# build scripts may override this in their own [lints] section, e.g.:
#
#   [lints.clippy]
#   panic = "allow"
#   unwrap_used = "allow"
#   expect_used = "allow"
#
# This is the documented escape hatch — do not sprinkle #[allow(...)]
# at call sites unless the override pattern is impractical.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
