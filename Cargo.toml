[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/manifest",
    "crates/backend",
    "crates/wasmtime-backend",
    "crates/kernel",
    "crates/network",
    "crates/test-utils",
]
exclude = [
    # Wasm-only fixtures — built for wasm32-unknown-unknown by
    # `just build-fixtures` and wrapped into components via wasm-tools.
    # Workspace inclusion would force `cargo check --workspace` to
    # attempt cross-compiling on every gate run.
    "tests/fixtures/counter-state-apply",
    "tests/fixtures/over-importer",
    "tests/fixtures/pre-check-rejector",
    "tests/fixtures/infinite-loop",
    "tests/fixtures/float-banned",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/intendednull/myrhiza"
rust-version = "1.95"

[workspace.dependencies]
# Pins required by determinism.md §5.4 and distribution.md §10.2.
bincode = "=1.3.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
blake3 = { version = "1.5", features = ["traits-preview"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast", "zeroize"] }
toml_edit = { version = "0.22", default-features = false, features = ["parse", "serde"] }
unicode-normalization = "0.1"
thiserror = "1"
hex = "0.4"
# Bech32m (BIP-350) for filename-embedded public keys. Per
# 2026-05-19-plan-b-2 spec §4: secrets are raw 32-byte binary files
# (Willow "no wsecret HRP, ever"); bech32m is filename-only.
bech32 = "=0.11.0"
# Drop-time zeroization of in-memory key material on PeerKeypair /
# AuthorKeypair. Per 2026-05-19-plan-b-2 spec §3 (Willow precedent).
zeroize = { version = "1.7", features = ["derive"] }
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["sync", "rt", "macros", "time"] }
# Wasmtime LTS — kernel-major bump per browser-native.md §14.2.
wasmtime = { version = "=36.0.9", default-features = false, features = ["component-model", "cranelift", "runtime"] }
wasmtime-wasi = { version = "=36.0.9", default-features = false }
# Iroh transport substrate. Pinned tight per
# prior-art/iroh/lessons.md §Avoid row 1 (iroh pre-1.0 API churn —
# "every minor is breaking"). Bump deliberately.
iroh = "=1.0.0-rc.0"
iroh-gossip = "=0.99.0"
# iroh-gossip's `GossipTopic` implements `n0_future::Stream`;
# `futures-lite::StreamExt` provides the `.next()` adapter we use to
# poll it. Tight-pinned in lockstep with the iroh ecosystem (per
# prior-art/iroh/lessons.md §Avoid row 1 — pin all data-plane crates
# together; this crate gates how we drive iroh-gossip's stream).
# Feature-gated under `network-iroh` on `myrhiza-network`. Per B-4.1
# spec §3.2.
futures-lite = "=2.6.1"
# Iroh-gossip's broadcast payload type — `bytes::Bytes` crosses the
# iroh-gossip public API boundary (`GossipSender::broadcast(Bytes)`).
# Tight-pinned in lockstep with the iroh ecosystem (per
# prior-art/iroh/lessons.md §Avoid row 1) so the ABI seam stays
# coherent. Feature-gated under `network-iroh`. Per B-4.1 spec §3.2.
bytes = "=1.11.1"
# Test/dev only.
anyhow = "1"
hex-literal = "0.4"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# panic!() / unwrap()/expect() are warns workspace-wide so the
# state-apply runtime path stays panic-free. Test-only crates and
# build scripts may override this in their own [lints] section, e.g.:
#
#   [lints.clippy]
#   panic = "allow"
#   unwrap_used = "allow"
#   expect_used = "allow"
#
# This is the documented escape hatch — do not sprinkle #[allow(...)]
# at call sites unless the override pattern is impractical.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
