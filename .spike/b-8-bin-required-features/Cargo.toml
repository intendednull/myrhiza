[package]
name = "spike-bin"
version = "0.1.0"
edition = "2024"
publish = false

# The spike is intentionally standalone — declaring an empty workspace
# table makes Cargo treat this directory as its own workspace root
# instead of trying to inherit the parent at the repo root. Per the
# T0 task constraints, we may not touch the root `workspace.members`
# / `workspace.exclude`; this is the documented escape hatch.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "spike-bin"
path = "src/bin.rs"
required-features = ["state-apply"]

[features]
state-apply = []

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
strip = "symbols"
