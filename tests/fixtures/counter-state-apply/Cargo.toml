[package]
name = "counter-state-apply-fixture"
version = "0.1.0"
edition = "2024"
publish = false

# Intentionally NOT a workspace member — see root `Cargo.toml`'s
# `[workspace.exclude]`. The fixture builds for `wasm32-unknown-unknown`
# and is wrapped into a component by `just build-fixtures`.
[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.30"
serde = { version = "1", features = ["derive"] }
bincode = "=1.3.3"
