[package]
name = "poll-state-apply-fixture"
version = "0.1.0"
edition = "2024"
publish = false

# Intentionally NOT a workspace member — see root `Cargo.toml`'s
# `[workspace.exclude]`. The fixture builds for `wasm32-unknown-unknown`
# and is wrapped into a component by `just build-fixtures`.

# Empty [workspace] table makes this crate its own workspace root so
# cargo's manifest walk-up terminates here. Without it, when the
# fixture is built from inside a git worktree nested under the main
# repo (e.g. `<repo>/.claude/worktrees/<name>/tests/fixtures/...`),
# cargo's resolver finds the worktree's own Cargo.toml but then
# continues up to the main repo's Cargo.toml — whose `exclude` list
# uses paths relative to itself and does not match the worktree-
# relative path — producing the misleading "current package believes
# it's in a workspace when it's not" error.
#
# This is the canonical escape cargo's own error message recommends
# (`add an empty [workspace] table`). Each fixture already maintains
# its own Cargo.lock as a consequence of being workspace-excluded;
# this change keeps that invariant and adds robustness to filesystem
# positioning. The same one-liner should be applied to the other
# fixtures in a follow-up infrastructure pass.
[workspace]
[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.30"

# panic=abort + aggressive size opts so the float-Display dispatch
# table the std panic machinery would otherwise pull in gets dead-
# code-eliminated. Without this, `cargo build --release` emits
# f64.load/f64.store instructions in unused panic format paths,
# which the byte-level float-ban lint (determinism.md §5.2) rejects
# at instantiation.
#
# We also avoid serde+bincode entirely (see src/lib.rs comment): even
# `#![no_std]` with derive-only serde pulls in `visit_f64` / `<f64 as
# Display>::fmt` from serde_core's trait dispatch. Hand-rolled
# fixed-width big-endian encoding sidesteps that.
[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
strip = "symbols"
