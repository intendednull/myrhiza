[package]
name = "poll-state-propose-fixture"
version = "0.1.0"
edition = "2024"
publish = false

# Intentionally NOT a workspace member — see root `Cargo.toml`'s
# `[workspace.exclude]`. The fixture builds for `wasm32-unknown-unknown`
# and is wrapped into a component by `just build-fixtures`.
[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.30"

# panic=abort + aggressive size opts so the float-Display dispatch
# table the std panic machinery would otherwise pull in gets dead-
# code-eliminated. Without this, `cargo build --release` emits
# f64.load/f64.store instructions in unused panic format paths,
# which the byte-level float-ban lint (determinism.md §5.2) rejects
# at instantiation.
#
# We also avoid serde+bincode entirely: even `#![no_std]` with
# derive-only serde pulls in `visit_f64` / `<f64 as Display>::fmt`
# from serde_core's trait dispatch. Hand-rolled fixed-width big-endian
# encoding sidesteps that.
[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
strip = "symbols"
