[package]
name = "myrhiza-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Myrhiza runtime kernel: install flow + state-apply ABI + state-digest stub."

[lints]
workspace = true

[dependencies]
myrhiza-types = { path = "../types" }
myrhiza-manifest = { path = "../manifest" }
myrhiza-backend = { path = "../backend" }
myrhiza-wasmtime-backend = { path = "../wasmtime-backend" }
myrhiza-network = { path = "../network" }
serde.workspace = true
thiserror.workspace = true
bincode.workspace = true
blake3.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
rand_core = "0.6"
# Used by FilesystemIdentityStore for OsRng on the secret-generation
# path (B-2 §6.3). Same crate the existing tests_topo shuffle property
# test uses; consolidating into [dependencies] so the dev-dep line in
# [dev-dependencies] becomes redundant.
rand = "0.8"
bech32 = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
async-trait.workspace = true

[features]
# Pass-through so `cargo test -p myrhiza-kernel --features network-iroh`
# compiles the iroh-dependent tests in `tests/attribution.rs` (tests 11-12).
# Mirrors the `network-iroh` feature on `myrhiza-network`.
#
# B-10 T8: adds `myrhiza-distribution` to the feature gate — this
# crate's `BundleDistribution::fetch` is how the kernel embedder
# materializes a `BundleAddress::IrohBlob` into a `Disk` variant for
# `InstallFlow::load`. The kernel itself does NOT take a direct
# `iroh-blobs` dep (spec §4.6 dep direction: `kernel → distribution`,
# distribution owns iroh-blobs).
network-iroh = [
    "myrhiza-network/network-iroh",
    "myrhiza-test-utils/network-iroh",
    "myrhiza-distribution/network-iroh",
    "dep:iroh",
    "dep:iroh-gossip",
    "dep:myrhiza-distribution",
]

[dependencies.iroh]
workspace = true
optional = true

[dependencies.iroh-gossip]
workspace = true
optional = true

[dependencies.myrhiza-distribution]
path = "../distribution"
optional = true

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
myrhiza-test-utils = { path = "../test-utils" }
myrhiza-wasmtime-backend = { path = "../wasmtime-backend" }
