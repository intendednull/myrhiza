[package]
name = "myrhiza-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Myrhiza runtime kernel: install flow + state-apply ABI + state-digest stub."

[lints]
workspace = true

[dependencies]
myrhiza-types = { path = "../types" }
myrhiza-manifest = { path = "../manifest" }
myrhiza-backend = { path = "../backend" }
myrhiza-wasmtime-backend = { path = "../wasmtime-backend" }
myrhiza-network = { path = "../network" }
serde.workspace = true
thiserror.workspace = true
bincode.workspace = true
blake3.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
rand_core = "0.6"
bech32 = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
async-trait.workspace = true

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
myrhiza-test-utils = { path = "../test-utils" }
myrhiza-wasmtime-backend = { path = "../wasmtime-backend" }
# Used by tests_topo shuffle property test. 0.8 pairs with the existing
# rand_core 0.6 line dep — no upgrade required for this test.
rand = "0.8"
