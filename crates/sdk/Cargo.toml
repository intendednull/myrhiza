[package]
name = "myrhiza-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Myrhiza application author surface — WIT, manifest macros, runtime-init boilerplate."

# The `__boilerplate` module (wasm32-only) implements `GlobalAlloc`,
# which fundamentally requires `unsafe`. The workspace forbids
# `unsafe_code`; we relax to `deny` here so the module's narrowly-
# scoped `#[allow(unsafe_code)]` annotations apply. This is the only
# crate in the workspace with unsafe code; expansion of this surface
# requires a deliberate spec update.
#
# All other workspace-level lints are mirrored explicitly. `[lints]`
# is all-or-nothing: setting any `[lints.rust]` or `[lints.clippy]`
# entry disables `lints.workspace = true`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
myrhiza-types = { path = "../types" }
myrhiza-manifest = { path = "../manifest" }

[features]
default = []
