[package]
name = "myrhiza-network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Network transport abstraction + in-process MemNetwork double for the Myrhiza runtime."

[lints]
workspace = true

[dependencies]
myrhiza-types = { path = "../types" }
# Pure-tier RevocationEvent / PublicationEvent carried by the
# GossipMessage::{Revocation,Publication} variants (B-11 §3.1). Unconditional
# because the variants exist in every build; distribution's pure tier has no
# iroh dep, so this pulls no transport. distribution carries NO dep on network
# (B-11 removed the lone blobs.rs use of network's iroh helper, inlining it as
# `conversions::endpoint_id_from_peer_pubkey`), so this edge is acyclic.
myrhiza-distribution = { path = "../distribution" }
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
serde.workspace = true
thiserror.workspace = true
bincode.workspace = true
iroh = { workspace = true, optional = true }
iroh-gossip = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[features]
default = []
# Enables `cfg(test)`-only affordances (MemBus::inject_lag, etc.) for
# cross-crate test code that needs deterministic lag-recovery setup
# without paying for natural broadcast-channel overflow. See spec §6.3
# (review-finding M-3). The network crate's own integration tests in
# tests/ activate the affordances via cfg(test); downstream crates
# (kernel, test-utils) enable this feature in their dev-deps.
test-helpers = []
# Iroh transport implementation of the `Network` trait. Default-off.
# Pulls in `iroh` + `iroh-gossip`. Per B-4.0 spec §3.1.
network-iroh = ["dep:iroh", "dep:iroh-gossip", "dep:futures-lite", "dep:bytes"]

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
