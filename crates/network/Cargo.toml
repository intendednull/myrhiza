[package]
name = "myrhiza-network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Network transport abstraction + in-process MemNetwork double for the Myrhiza runtime."

[lints]
workspace = true

[dependencies]
myrhiza-types = { path = "../types" }
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
serde.workspace = true
thiserror.workspace = true
bincode.workspace = true

[features]
# Enables `cfg(test)`-only affordances (MemBus::inject_lag, etc.) for
# cross-crate test code that needs deterministic lag-recovery setup
# without paying for natural broadcast-channel overflow. See spec §6.3
# (review-finding M-3). The network crate's own integration tests in
# tests/ activate the affordances via cfg(test); downstream crates
# (kernel, test-utils) enable this feature in their dev-deps.
test-helpers = []

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
